<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<title>Устройства рядом</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #f0f0f5;
    background: #06060c;
    overflow-x: hidden;
  }

  /* === Живой фон === */
  .bg {
    position: fixed; inset: -60%; z-index: -3;
    background:
      radial-gradient(circle at 15% 25%, #1e3a8a 0%, transparent 40%),
      radial-gradient(circle at 85% 20%, #7c3aed 0%, transparent 40%),
      radial-gradient(circle at 30% 80%, #0891b2 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #db2777 0%, transparent 40%);
    filter: blur(80px);
    opacity: 0.7;
    animation: bgShift 26s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); }
    50%  { transform: translate(4%, -3%) scale(1.15) rotate(6deg); }
    100% { transform: translate(-3%, 4%) scale(1.05) rotate(-4deg); }
  }
  .noise {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.4'/></svg>");
    opacity: 0.05; mix-blend-mode: overlay;
  }
  .grid-lines {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask: radial-gradient(ellipse at center, #000 0%, transparent 75%);
    -webkit-mask: radial-gradient(ellipse at center, #000 0%, transparent 75%);
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 26px 18px calc(50px + env(safe-area-inset-bottom));
    position: relative;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
    animation: fadeDown 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform:none; } }

  h1 {
    font-size: 27px; font-weight: 800;
    letter-spacing: -0.7px;
    background: linear-gradient(120deg, #fff 0%, #a5b4fc 30%, #67e8f9 55%, #f0abfc 75%, #fff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 220% center; } }

  .subtitle {
    margin-top: 6px; font-size: 12.5px;
    color: #94a3b8; letter-spacing: 0.2px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    animation: fadeDown 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
  }
  .stat {
    padding: 12px 8px;
    border-radius: 14px;
    background: rgba(28,28,40,0.55);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.07);
    text-align: center;
  }
  .stat .num {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(180deg, #fff, #a5b4fc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .stat .num.bump { transform: scale(1.35); }
  .stat .lbl {
    display: block; margin-top: 5px;
    font-size: 10.5px; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 14px;
    animation: fadeDown 0.9s 0.15s cubic-bezier(0.16,1,0.3,1) both;
  }
  .btn {
    position: relative;
    padding: 18px 22px;
    border: 0; border-radius: 18px;
    font-size: 16px; font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6 45%, #ec4899);
    background-size: 220% 220%;
    cursor: pointer; overflow: hidden;
    box-shadow:
      0 12px 32px -10px rgba(139,92,246,0.65),
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 1px 0 rgba(255,255,255,0.25) inset;
    transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s, opacity 0.3s;
    animation: btnGlow 5s ease-in-out infinite;
    font-family: inherit;
  }
  @keyframes btnGlow {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled {
    background: linear-gradient(135deg, #374151, #1f2937);
    box-shadow: none; animation: none; opacity: 0.85;
    cursor: default;
  }
  .btn::after {
    content: "";
    position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.6s ease-in-out infinite;
  }
  .btn:disabled::after { display: none; }
  @keyframes sweep {
    0%   { left: -60%; }
    55%  { left: 130%; }
    100% { left: 130%; }
  }

  .btn-icon {
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(28,28,40,0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    color: #cbd5e1;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s, color 0.3s, opacity 0.3s;
  }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon:disabled { opacity: 0.35; cursor: default; }
  .btn-icon.danger:active { background: rgba(239,68,68,0.2); color: #f87171; }

  .radar {
    display: none;
    margin: 22px auto 6px;
    width: 150px; height: 150px;
    position: relative;
  }
  .radar.on { display: block; animation: fadeIn 0.45s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: scale(0.85); } to { opacity:1; transform:none; } }

  .radar .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(139,92,246,0.55);
    animation: pulse 2.4s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  .radar .ring:nth-child(2) { animation-delay: 0.6s; }
  .radar .ring:nth-child(3) { animation-delay: 1.2s; }
  .radar .ring:nth-child(4) { animation-delay: 1.8s; }
  @keyframes pulse {
    0%   { transform: scale(0.25); opacity: 1; }
    100% { transform: scale(1);    opacity: 0; }
  }
  .radar .core {
    position: absolute; top: 50%; left: 50%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: radial-gradient(circle, #c4b5fd, #6366f1);
    box-shadow: 0 0 26px 8px rgba(139,92,246,0.75);
    animation: coreBlink 1.4s ease-in-out infinite;
  }
  @keyframes coreBlink {
    0%,100% { transform: scale(1);   opacity: 1; }
    50%     { transform: scale(1.45); opacity: 0.55; }
  }
  .radar .sweep {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(139,92,246,0.4) 40deg, transparent 90deg);
    animation: rotate 2s linear infinite;
    mask: radial-gradient(circle, transparent 0%, #000 38%);
    -webkit-mask: radial-gradient(circle, transparent 0%, #000 38%);
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .status {
    text-align: center; font-size: 13px; color: #94a3b8;
    min-height: 20px; margin: 6px 0 4px;
    transition: color 0.3s;
  }
  .status.ok  { color: #4ade80; }
  .status.err { color: #f87171; }

  .list {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 8px;
    position: relative;
  }

  .dev {
    position: relative;
    padding: 16px 18px 14px;
    border-radius: 18px;
    background: rgba(28,28,40,0.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 28px -12px rgba(0,0,0,0.7);
    overflow: hidden;
    will-change: transform;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  .dev::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #8b5cf6, #ec4899, #06b6d4);
    opacity: 0.9;
    transition: opacity 0.4s;
  }
  .dev.stale::before { opacity: 0.25; }
  .dev.fresh {
    animation: cardIn 0.65s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-14px) scale(0.96); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  .dev.flash { animation: flash 0.9s ease-out; }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 0 rgba(139,92,246,0.65); }
    100% { box-shadow: 0 0 0 22px rgba(139,92,246,0); }
  }

  /* === Верхняя строка карточки с иконкой === */
  .row1 {
    display: flex; align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  /* Значок типа устройства */
  .icon-badge {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow:
      0 6px 18px -6px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.25);
    position: relative;
    overflow: hidden;
  }
  .icon-badge::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 55%);
    pointer-events: none;
  }
  .icon-badge svg {
    width: 24px; height: 24px;
    display: block;
    position: relative; z-index: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

  .name-wrap {
    flex: 1;
    min-width: 0;
  }
  .name {
    font-weight: 700; font-size: 15.5px;
    color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.2;
  }
  .type-label {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .live {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(34,197,94,0.15);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,0.3);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .live .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%,100% { transform: scale(1);   opacity: 1; }
    50%     { transform: scale(1.5); opacity: 0.5; }
  }
  .live.stale {
    background: rgba(148,163,184,0.15);
    color: #94a3b8;
    border-color: rgba(148,163,184,0.3);
  }
  .live.stale .dot {
    background: #64748b;
    box-shadow: none;
    animation: none;
  }

  .id {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: #94a3b8;
    word-break: break-all;
    margin-bottom: 10px;
    opacity: 0.75;
    padding-left: 56px; /* выравнивание под иконку */
  }

  .bars {
    display: flex; gap: 4px; align-items: flex-end;
    height: 22px; margin-bottom: 8px;
    padding-left: 56px;
  }
  .bars span {
    flex: 1; height: 25%;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    transition: background 0.4s, height 0.5s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s;
  }
  .bars.lvl-1 span:nth-child(-n+1),
  .bars.lvl-2 span:nth-child(-n+2),
  .bars.lvl-3 span:nth-child(-n+3),
  .bars.lvl-4 span:nth-child(-n+4),
  .bars.lvl-5 span:nth-child(-n+5) {
    background: linear-gradient(180deg, #a78bfa, #8b5cf6);
    box-shadow: 0 0 10px rgba(139,92,246,0.55);
  }
  .bars.lvl-1 span:nth-child(1) { height: 30%; }
  .bars.lvl-2 span:nth-child(2) { height: 50%; }
  .bars.lvl-3 span:nth-child(3) { height: 70%; }
  .bars.lvl-4 span:nth-child(4) { height: 90%; }
  .bars.lvl-5 span:nth-child(5) { height: 100%; }

  .meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #cbd5e1;
    padding-left: 56px;
  }
  .meta .label { color: #94a3b8; font-size: 11.5px; }
  .meta b { color: #a5b4fc; font-weight: 700; }
  .meta .seen { color: #64748b; font-size: 11px; font-variant-numeric: tabular-nums; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: #64748b;
    animation: fadeIn 0.6s both;
  }
  .empty .icon {
    font-size: 48px;
    opacity: 0.35;
    margin-bottom: 12px;
    display: block;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .empty p { font-size: 13px; line-height: 1.55; }

  .toast {
    position: fixed;
    left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 120px);
    padding: 12px 20px;
    border-radius: 14px;
    background: rgba(20,20,32,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(139,92,246,0.4);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.8);
    font-size: 13.5px; font-weight: 600;
    color: #fff;
    z-index: 100;
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.3s;
    pointer-events: none;
    max-width: calc(100vw - 40px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }
  .toast .em { color: #a5b4fc; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="noise"></div>
  <div class="grid-lines"></div>

  <div class="wrap">
    <header>
      <h1>📡 Устройства рядом</h1>
      <p class="subtitle">Bluetooth Low Energy · живые данные</p>
    </header>

    <div class="stats">
      <div class="stat"><div class="num" id="s-total">0</div><span class="lbl">Всего</span></div>
      <div class="stat"><div class="num" id="s-active">0</div><span class="lbl">В эфире</span></div>
      <div class="stat"><div class="num" id="s-best">—</div><span class="lbl">Ближе всех</span></div>
    </div>

    <div class="actions">
      <button class="btn" id="scan">🔍 Добавить устройство</button>
      <button class="btn-icon danger" id="clear" title="Очистить" disabled>🗑</button>
    </div>

    <div class="radar" id="radar">
      <div class="ring"></div><div class="ring"></div>
      <div class="ring"></div><div class="ring"></div>
      <div class="sweep"></div><div class="core"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="list" id="list">
      <div class="empty" id="empty">
        <span class="icon">📶</span>
        <p>Нажми <b style="color:#a5b4fc">«Добавить устройство»</b>,<br>выбери BLE-девайс — и он появится здесь.<br>Можно добавить сколько угодно.</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   SVG-ИКОНКИ ТИПОВ УСТРОЙСТВ
   Все рисуются через currentColor — цвет задаёт бейдж.
   ============================================================ */
const ICONS = {
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><line x1="11" y1="18" x2="13" y2="18"/></svg>`,
  tablet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>`,
  laptop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.8"/><path d="M2 19h20"/></svg>`,
  watch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="10" height="12" rx="2.8"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M9 18v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2"/></svg>`,
  headphones: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.8"/><rect x="17" y="14" width="4" height="7" rx="1.8"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><circle cx="12" cy="8" r="1.8"/><circle cx="12" cy="15.5" r="3"/></svg>`,
  tv: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="13" rx="2.2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>`,
  car: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16v-3l2-5.5h10L19 13v3"/><path d="M3 16h18"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/><path d="M9 10.5h6"/></svg>`,
  light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.5 1 2.5h6c0-1 .3-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>`,
  tracker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke-dasharray="0.1 3"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="4"/><path d="M8.5 7l1.4-2.5h4.2L15.5 7"/></svg>`,
  keyboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M6 11h.01M10 11h.01M14 11h.01M18 11h.01M6 14.5h.01M18 14.5h.01M9 14.5h6"/></svg>`,
  mouse: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="5"/><line x1="12" y1="7" x2="12" y2="11"/></svg>`,
  printer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="7" rx="0.5"/></svg>`,

  drone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="6" height="6" rx="1.5"/><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M9 9L6.5 6.5M15 9l2.5-2.5M9 15l-2.5 2.5M15 15l2.5 2.5"/></svg>`,
  unknown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 5 0c0 1.6-2.5 2-2.5 4"/><circle cx="12" cy="17" r="0.7" fill="currentColor"/></svg>`
};

/* ============================================================
   ЦВЕТА И РУССКИЕ НАЗВАНИЯ ДЛЯ КАТЕГОРИЙ
   ============================================================ */
const CAT = {
  phone:      { bg: 'linear-gradient(135deg,#3b82f6,#8b5cf6)', label: 'Телефон' },
  tablet:     { bg: 'linear-gradient(135deg,#06b6d4,#0891b2)', label: 'Планшет' },
  laptop:     { bg: 'linear-gradient(135deg,#6366f1,#4f46e5)', label: 'Ноутбук' },
  watch:      { bg: 'linear-gradient(135deg,#ec4899,#f43f5e)', label: 'Часы' },
  headphones: { bg: 'linear-gradient(135deg,#a855f7,#8b5cf6)', label: 'Наушники' },
  speaker:    { bg: 'linear-gradient(135deg,#f59e0b,#f97316)', label: 'Колонка' },
  tv:         { bg: 'linear-gradient(135deg,#ef4444,#f43f5e)', label: 'Телевизор' },
  car:        { bg: 'linear-gradient(135deg,#10b981,#059669)', label: 'Автомобиль' },
  light:      { bg: 'linear-gradient(135deg,#eab308,#f59e0b)', label: 'Умный свет' },
  tracker:    { bg: 'linear-gradient(135deg,#06b6d4,#0ea5e9)', label: 'Трекер' },
  camera:     { bg: 'linear-gradient(135deg,#f43f5e,#ec4899)', label: 'Камера' },
  keyboard:   { bg: 'linear-gradient(135deg,#64748b,#475569)', label: 'Клавиатура' },
  mouse:      { bg: 'linear-gradient(135deg,#64748b,#475569)', label: 'Мышь' },
  printer:    { bg: 'linear-gradient(135deg,#94a3b8,#64748b)', label: 'Принтер' },
  beacon:     { bg: 'linear-gradient(135deg,#8b5cf6,#6366f1)', label: 'Маяк' },
  gamepad:    { bg: 'linear-gradient(135deg,#8b5cf6,#ec4899)', label: 'Геймпад' },
  ring:       { bg: 'linear-gradient(135deg,#14b8a6,#0891b2)', label: 'Кольцо' },
  drone:      { bg: 'linear-gradient(135deg,#0ea5e9,#6366f1)', label: 'Дрон' },
  unknown:    { bg: 'linear-gradient(135deg,#475569,#334155)', label: 'Устройство' }
};

/* ============================================================
   ОПРЕДЕЛЕНИЕ ТИПА УСТРОЙСТВА ПО ИМЕНИ
   ============================================================ */
function detectType(rawName) {
  const n = (rawName || '').toLowerCase();
  if (!n) return 'unknown';

  // Apple — сначала, потому что очень специфично
  if (/\biphone\b/.test(n))                return 'phone';
  if (/\bipad\b/.test(n))                  return 'tablet';
  if (/\bmacbook|\bimac|\bmac\s?mini|\bmac\s?pro|\bmac\s?studio/.test(n)) return 'laptop';
  if (/\bairpods|\bairpod|\bbeats\b/.test(n)) return 'headphones';
  if (/\bairtag\b/.test(n))                return 'tracker';
  if (/\bhomepod\b/.test(n))               return 'speaker';
  if (/\bapple\s?watch|\bwatch\b/.test(n)) return 'watch';

  // Носимые
  if (/\bband\b|\bmi\s?band\b|\bamazfit\b|\bgarmin\b|\bfitbit\b|\bhuawei\s?watch|\bgalaxy\s?watch|\bsmart\s?watch/.test(n)) return 'watch';
  if (/\bring\b|\bsmartring|\boring\b/.test(n)) return 'ring';

  // Телефоны (после проверки watch, чтобы "Galaxy Watch" не стал телефоном)
  if (/\bgalaxy\b|\bpixel\b|\bxiaomi\b|\bredmi\b|\boneplus\b|\bhuawei\b|\bhonor\b|\boppo\b|\bvivo\b|\brealme\b|\bmotorola\b|\bnokia\b|\bphone\b|\bmi\s?\d/.test(n)) return 'phone';

  // Планшеты
  if (/\btab\b|\btablet\b|\bpad\b/.test(n)) return 'tablet';

  // Ноутбуки
  if (/\blaptop\b|\bnotebook\b|\bthinkpad\b|\bsurface\b|\bzenbook\b|\bideapad\b/.test(n)) return 'laptop';

  // Телевизоры (аккуратно, чтобы "tv" не совпало случайно)
  if (/\bsmart\s?tv\b|\btelevision\b|\bbravia\b|\bwebos\b|\btizen\b|\bchromecast\b|\bfire\s?tv\b|\bandroid\s?tv\b|\blg\s?tv\b|\bsamsung\s?tv\b|\b_tv\b|\btv_/.test(n)) return 'tv';
  if (/\btv\b/.test(n)) return 'tv';

  // Аудио — сначала наушники, потом колонки
  if (/\bbuds\b|\bearbud|\bearphone|\bheadphone|\bheadset|\bjbl\b|\bbose\b|\bsennheiser\b|\baudio.technica|\bwh-|\bwf-/.test(n)) return 'headphones';
  if (/\bspeaker\b|\bsoundbar\b|\becho\b|\bjbl\s?flip|\bjbl\s?charge/.test(n)) return 'speaker';

  // Авто
  if (/\btesla\b|\bbmw\b|\baudi\b|\btoyota\b|\bhonda\b|\bmercedes\b|\bvolvo\b|\bcar\b|\bauto\b|\bobd\b/.test(n)) return 'car';

  // Свет
  if (/\bled\b|\blednet|\blight\b|\blamp\b|\bbulb\b|\bhue\b|\blifx\b|\byeelight\b|\bphilips\s?hue/.test(n)) return 'light';

  // Трекеры
  if (/\btile\b|\btracker\b|\btag\b|\bchipolo\b/.test(n)) return 'tracker';

  // Камеры
  if (/\bcam\b|\bcamera\b|\bgopro\b|\binsta360\b/.test(n)) return 'camera';

  // Принтеры
  if (/\bprint|\bepson\b|\bcanon\b|\bhp\s|\bdeskjet\b|\blaserjet\b/.test(n)) return 'printer';

  // Периферия
  if (/\bkeyboard\b|\bkbd\b/.test(n)) return 'keyboard';
  if (/\bmouse\b|\bmice\b/.test(n))    return 'mouse';
  if (/\bgamepad\b|\bgamepad|\bcontroller|\bxbox|\bdualsense|\bdualshock/.test(n)) return 'gamepad';

  // Маяки и дроны
  if (/\bbeacon\b|\bibeacon\b|\beddystone\b/.test(n)) return 'beacon';
  if (/\bdrone\b|\bdji\b/.test(n)) return 'drone';

  return 'unknown';
}

/* ============================================================
   Состояние
   ============================================================ */
const devices = new Map();
const ACTIVE_MS = 6000;

const listEl   = document.getElementById('list');
const emptyEl  = document.getElementById('empty');
const statusEl = document.getElementById('status');
const radarEl  = document.getElementById('radar');
const btn      = document.getElementById('scan');
const clearBtn = document.getElementById('clear');
const toastEl  = document.getElementById('toast');
const sTotal   = document.getElementById('s-total');
const sActive  = document.getElementById('s-active');
const sBest    = document.getElementById('s-best');

/* ============================================================
   Утилиты
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function rssiInfo(rssi) {
  if (rssi === null || rssi === undefined)
    return { label: 'нет данных', cls: 'na', bars: '' };
  if (rssi > -55) return { label: 'очень близко', cls: 'b5', bars: 'lvl-5' };
  if (rssi > -70) return { label: 'близко',       cls: 'b4', bars: 'lvl-4' };
  if (rssi > -80) return { label: 'средне',       cls: 'b3', bars: 'lvl-3' };
  if (rssi > -90) return { label: 'далеко',       cls: 'b2', bars: 'lvl-2' };
  return              { label: 'очень далеко', cls: 'b1', bars: 'lvl-1' };
}

function showToast(text, emoji = '✨') {
  toastEl.innerHTML = `<span class="em">${emoji}</span> ${escapeHtml(text)}`;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 320);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 2) return 'только что';
  if (s < 60) return `${s} сек назад`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} мин назад`;
  return `${Math.floor(m/60)} ч назад`;
}

/* ============================================================
   Создание карточки устройства (с SVG-иконкой типа)
   ============================================================ */
function buildIconHtml(type) {
  const cat = CAT[type] || CAT.unknown;
  const svg = ICONS[type] || ICONS.unknown;
  return {
    badge: `<div class="icon-badge" style="background:${cat.bg}">${svg}</div>`,
    label: cat.label,
    type
  };
}

function createCard(id, name) {
  const type = detectType(name);
  const { badge, label } = buildIconHtml(type);

  const el = document.createElement('div');
  el.className = 'dev fresh';
  el.dataset.id = id;
  el.innerHTML = `
    <div class="row1">
      <div class="icon-slot">${badge}</div>
      <div class="name-wrap">
        <div class="name">${escapeHtml(name || 'Устройство без имени')}</div>
        <div class="type-label">${label}</div>
      </div>
      <div class="live">
        <span class="dot"></span><span class="live-text">в эфире</span>
      </div>
    </div>
    <div class="id">${escapeHtml(id)}</div>
    <div class="bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="meta">
      <span class="label">Уровень сигнала</span>
      <span><b class="rssi">—</b></span>
    </div>
    <div class="meta" style="margin-top:4px">
      <span class="label">Последний раз</span>
      <span class="seen">только что</span>
    </div>
  `;
  return el;
}

/* ============================================================
   Обновление карточки
   ============================================================ */
function updateCard(entry) {
  const { el, rssi, lastSeen } = entry;
  const info = rssiInfo(rssi);

  const rssiEl = el.querySelector('.rssi');
  const barsEl = el.querySelector('.bars');
  const liveEl = el.querySelector('.live');
  const liveText = el.querySelector('.live-text');
  const seenEl = el.querySelector('.seen');

  rssiEl.textContent = rssi === null ? '—' : rssi + ' дБм';
  barsEl.className = 'bars ' + info.bars;

  const isActive = Date.now() - lastSeen < ACTIVE_MS;
  if (isActive) {
    liveEl.classList.remove('stale');
    liveText.textContent = 'в эфире';
    el.classList.remove('stale');
  } else {
    liveEl.classList.add('stale');
    liveText.textContent = 'не слышно';
    el.classList.add('stale');
  }
  seenEl.textContent = timeAgo(lastSeen);

  // Если имя стало известно позже — обновляем иконку и подпись
  const currentType = detectType(entry.name);
  if (currentType !== entry.type) {
    entry.type = currentType;
    const { badge, label } = buildIconHtml(currentType);
    const slot = el.querySelector('.icon-slot');
    const labelEl = el.querySelector('.type-label');
    if (slot) slot.innerHTML = badge;
    if (labelEl) labelEl.textContent = label;
  }

  // Имя могло появиться позже
  if (entry.name) {
    const nameEl = el.querySelector('.name');
    if (nameEl && nameEl.textContent !== entry.name) {
      nameEl.textContent = entry.name;
    }
  }
}

/* ============================================================
   FLIP-сортировка по RSSI
   ============================================================ */
function sortList() {
  const entries = [...devices.values()];
  entries.sort((a, b) => {
    const ra = a.rssi === null ? -999 : a.rssi;
    const rb = b.rssi === null ? -999 : b.rssi;
    return rb - ra;
  });

  const positions = new Map();
  entries.forEach(e => {
    if (e.el.isConnected) positions.set(e.el, e.el.getBoundingClientRect().top);
  });

  entries.forEach(e => listEl.appendChild(e.el));

  entries.forEach(e => {
    if (!e.el.isConnected) return;
    const oldTop = positions.get(e.el);
    if (oldTop === undefined) return;
    const newTop = e.el.getBoundingClientRect().top;
    const dy = oldTop - newTop;
    if (Math.abs(dy) < 1) return;
    e.el.animate(
      [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
      { duration: 500, easing: 'cubic-bezier(0.16,1,0.3,1)' }
    );
  });
}

/* ============================================================
   Обновление статистики
   ============================================================ */
function refreshStats() {
  const total = devices.size;
  const active = [...devices.values()].filter(d => Date.now() - d.lastSeen < ACTIVE_MS).length;

  let best = null;
  for (const d of devices.values()) {
    if (d.rssi === null) continue;
    if (best === null || d.rssi > best) best = d.rssi;
  }

  if (sTotal.textContent !== String(total)) { sTotal.textContent = total; bump(sTotal); }
  if (sActive.textContent !== String(active)) { sActive.textContent = active; bump(sActive); }
  const bestStr = best === null ? '—' : best;
  if (sBest.textContent !== String(bestStr)) { sBest.textContent = bestStr; bump(sBest); }

  clearBtn.disabled = total === 0;
  emptyEl.style.display = total === 0 ? '' : 'none';
}

/* ============================================================
   Добавление устройства
   ============================================================ */
function addDevice(device) {
  const id = device.id;
  const name = device.name || null;

  if (devices.has(id)) {
    const e = devices.get(id);
    e.lastSeen = Date.now();
    if (name) e.name = name;
    updateCard(e);
    e.el.classList.remove('flash');
    void e.el.offsetWidth;
    e.el.classList.add('flash');
    e.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast('Уже в списке · ' + (e.name || 'без имени'), '🔁');
    return e;
  }

  const el = createCard(id, name);
  const entry = {
    id, name, rssi: null, lastSeen: Date.now(),
    el, watching: false,
    type: detectType(name)
  };
  devices.set(id, entry);

  listEl.appendChild(el);
  updateCard(entry);
  refreshStats();

  const cat = CAT[entry.type] || CAT.unknown;
  showToast(cat.label + ' · ' + (name || 'без имени'), '🎯');

  setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  startWatching(device, entry);
  setTimeout(sortList, 400);

  return entry;
}

/* ============================================================
   Live-обновления RSSI
   ============================================================ */
async function startWatching(device, entry) {
  if (entry.watching) return;
  if (!device.watchAdvertisements) {
    entry.lastSeen = Date.now();
    updateCard(entry);
    return;
  }
  try {
    entry.watching = true;
    device.addEventListener('advertisementreceived', (e) => {
      entry.rssi = e.rssi;
      entry.lastSeen = Date.now();
      if (e.device && e.device.name) entry.name = e.device.name;
      updateCard(entry);
      refreshStats();
    });
    await device.watchAdvertisements();
  } catch (err) {
    entry.watching = false;
  }
}

/* ============================================================
   Кнопка сканирования
   ============================================================ */
btn.addEventListener('click', async () => {
  statusEl.className = 'status';
  statusEl.textContent = '';

  if (!navigator.bluetooth) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Bluetooth недоступен. Установи beacio для Safari.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Открываю список...';
  radarEl.classList.add('on');
  statusEl.textContent = 'Выбери устройство в системном окне';

  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: []
    });

    radarEl.classList.remove('on');
    statusEl.className = 'status ok';
    statusEl.textContent = '✓ Добавлено в список';
    addDevice(device);

    setTimeout(() => {
      if (statusEl.textContent.startsWith('✓')) {
        statusEl.textContent = 'Нажми ещё раз, чтобы добавить следующее';
        statusEl.className = 'status';
      }
    }, 1800);
  } catch (e) {
    radarEl.classList.remove('on');
    if (String(e.message).toLowerCase().includes('cancel')) {
      statusEl.textContent = 'Отменено';
    } else {
      statusEl.className = 'status err';
      statusEl.textContent = 'Ошибка: ' + e.message;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Добавить устройство';
  }
});

/* ============================================================
   Очистка списка
   ============================================================ */
clearBtn.addEventListener('click', () => {
  if (devices.size === 0) return;
  if (!confirm('Очистить список устройств?')) return;

  for (const e of devices.values()) {
    e.el.style.transition = 'opacity .3s, transform .3s';
    e.el.style.opacity = '0';
    e.el.style.transform = 'scale(0.9)';
    setTimeout(() => e.el.remove(), 300);
  }
  devices.clear();
  refreshStats();
  showToast('Список очищен', '🧹');
  statusEl.textContent = '';
  statusEl.className = 'status';
});

/* ============================================================
   Таймер обновления "последний раз видели"
   ============================================================ */
setInterval(() => {
  for (const e of devices.values()) updateCard(e);
  refreshStats();
}, 1000);

setTimeout(() => showToast('Готово к сканированию', '👋'), 700);
</script>
