<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<title>Устройства рядом</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #f0f0f5; background: #06060c;
    overflow-x: hidden;
  }
  body.no-scroll { overflow: hidden; }

  .bg {
    position: fixed; inset: -60%; z-index: -3;
    background:
      radial-gradient(circle at 15% 25%, #1e3a8a 0%, transparent 40%),
      radial-gradient(circle at 85% 20%, #7c3aed 0%, transparent 40%),
      radial-gradient(circle at 30% 80%, #0891b2 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #db2777 0%, transparent 40%);
    filter: blur(80px); opacity: 0.7;
    animation: bgShift 26s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); }
    50%  { transform: translate(4%, -3%) scale(1.15) rotate(6deg); }
    100% { transform: translate(-3%, 4%) scale(1.05) rotate(-4deg); }
  }
  .noise {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.4'/></svg>");
    opacity: 0.05; mix-blend-mode: overlay;
  }
  .grid-lines {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask: radial-gradient(ellipse at center, #000 0%, transparent 75%);
    -webkit-mask: radial-gradient(ellipse at center, #000 0%, transparent 75%);
  }

  .wrap {
    max-width: 560px; margin: 0 auto;
    padding: 26px 18px calc(50px + env(safe-area-inset-bottom));
    position: relative;
  }

  header { text-align: center; margin-bottom: 22px; animation: fadeDown .7s cubic-bezier(.16,1,.3,1) both; }
  @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform:none; } }
  h1 {
    font-size: 27px; font-weight: 800; letter-spacing: -0.7px;
    background: linear-gradient(120deg,#fff 0%,#a5b4fc 30%,#67e8f9 55%,#f0abfc 75%,#fff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 220% center; } }
  .subtitle { margin-top: 6px; font-size: 12.5px; color: #94a3b8; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 16px;
    animation: fadeDown .8s .1s cubic-bezier(.16,1,.3,1) both;
  }
  .stat {
    padding: 12px 8px; border-radius: 14px;
    background: rgba(28,28,40,0.55);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.07);
    text-align: center;
  }
  .stat .num {
    font-size: 22px; font-weight: 800; line-height: 1;
    background: linear-gradient(180deg,#fff,#a5b4fc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .stat .num.bump { transform: scale(1.35); }
  .stat .lbl {
    display: block; margin-top: 5px;
    font-size: 10.5px; color: #94a3b8;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
  }

  .actions {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    margin-bottom: 14px;
    animation: fadeDown .9s .15s cubic-bezier(.16,1,.3,1) both;
  }
  .btn {
    position: relative; padding: 18px 22px;
    border: 0; border-radius: 18px;
    font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg,#6366f1,#8b5cf6 45%,#ec4899);
    background-size: 220% 220%;
    cursor: pointer; overflow: hidden;
    font-family: inherit;
    box-shadow:
      0 12px 32px -10px rgba(139,92,246,.65),
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 1px 0 rgba(255,255,255,.25) inset;
    transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .3s, opacity .3s;
    animation: btnGlow 5s ease-in-out infinite;
  }
  @keyframes btnGlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .btn:active { transform: scale(.97); }
  .btn:disabled { background: linear-gradient(135deg,#374151,#1f2937); box-shadow: none; animation: none; opacity: .85; cursor: default; }
  .btn::after {
    content: ""; position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);
    transform: skewX(-20deg); animation: sweep 3.6s ease-in-out infinite;
  }
  .btn:disabled::after { display: none; }
  @keyframes sweep { 0% { left: -60%; } 55% { left: 130%; } 100% { left: 130%; } }

  .btn-icon {
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(28,28,40,.7);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 18px; color: #cbd5e1; font-size: 20px;
    cursor: pointer;
    transition: transform .2s, background .3s, color .3s, opacity .3s;
  }
  .btn-icon:active { transform: scale(.92); }
  .btn-icon:disabled { opacity: .35; cursor: default; }
  .btn-icon.danger:active { background: rgba(239,68,68,.2); color: #f87171; }

  .radar { display: none; margin: 22px auto 6px; width: 150px; height: 150px; position: relative; }
  .radar.on { display: block; animation: fadeIn .45s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: scale(.85); } to { opacity:1; transform:none; } }
  .radar .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(139,92,246,.55);
    animation: pulse 2.4s cubic-bezier(.4,0,.2,1) infinite;
  }
  .radar .ring:nth-child(2) { animation-delay: .6s; }
  .radar .ring:nth-child(3) { animation-delay: 1.2s; }
  .radar .ring:nth-child(4) { animation-delay: 1.8s; }
  @keyframes pulse { 0% { transform: scale(.25); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  .radar .core {
    position: absolute; top: 50%; left: 50%;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: radial-gradient(circle,#c4b5fd,#6366f1);
    box-shadow: 0 0 26px 8px rgba(139,92,246,.75);
    animation: coreBlink 1.4s ease-in-out infinite;
  }
  @keyframes coreBlink { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: .55; } }
  .radar .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg,transparent 0deg,rgba(139,92,246,.4) 40deg,transparent 90deg);
    animation: rotate 2s linear infinite;
    mask: radial-gradient(circle,transparent 0%,#000 38%);
    -webkit-mask: radial-gradient(circle,transparent 0%,#000 38%);
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .status { text-align: center; font-size: 13px; color: #94a3b8; min-height: 20px; margin: 6px 0 4px; transition: color .3s; }
  .status.ok  { color: #4ade80; }
  .status.err { color: #f87171; }

  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; position: relative; }

  .dev {
    position: relative; padding: 16px 18px 14px;
    border-radius: 18px;
    background: rgba(28,28,40,.55);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 10px 28px -12px rgba(0,0,0,.7);
    overflow: hidden; will-change: transform;
    transition: border-color .3s, background .3s, box-shadow .3s, transform .2s;
    cursor: pointer;
  }
  .dev::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg,#8b5cf6,#ec4899,#06b6d4);
    opacity: .9; transition: opacity .4s;
  }
  .dev.stale::before { opacity: .25; }
  .dev.fresh { animation: cardIn .65s cubic-bezier(.16,1,.3,1) both; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  .dev.flash { animation: flash .9s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(139,92,246,.65); } 100% { box-shadow: 0 0 0 22px rgba(139,92,246,0); } }
  .dev:active { transform: scale(.985); }

  .row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .icon-badge {
    flex-shrink: 0; width: 44px; height: 44px;
    border-radius: 13px; display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative; overflow: hidden;
  }
  .icon-badge::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%);
    pointer-events: none;
  }
  .icon-badge svg { width: 24px; height: 24px; display: block; position: relative; z-index: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .name-wrap { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .type-label { font-size: 11px; color: #94a3b8; margin-top: 2px; font-weight: 500; letter-spacing: .2px; }

  .live {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: .6px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(34,197,94,.15); color: #4ade80;
    border: 1px solid rgba(34,197,94,.3); flex-shrink: 0;
    transition: all .3s;
  }
  .live .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: dotPulse 1.4s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .5; } }
  .live.stale { background: rgba(148,163,184,.15); color: #94a3b8; border-color: rgba(148,163,184,.3); }
  .live.stale .dot { background: #64748b; box-shadow: none; animation: none; }
  .live.connected { background: rgba(96,165,250,.18); color: #60a5fa; border-color: rgba(96,165,250,.4); }
  .live.connected .dot { background: #60a5fa; box-shadow: 0 0 10px #60a5fa; animation: dotPulse 1s ease-in-out infinite; }

  .id { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 11px; color: #94a3b8; word-break: break-all; margin-bottom: 10px; opacity: .75; padding-left: 56px; }
  .bars { display: flex; gap: 4px; align-items: flex-end; height: 22px; margin-bottom: 8px; padding-left: 56px; }
  .bars span { flex: 1; height: 25%; border-radius: 3px; background: rgba(255,255,255,.08); transition: background .4s, height .5s cubic-bezier(.16,1,.3,1), box-shadow .4s; }
  .bars.lvl-1 span:nth-child(-n+1),
  .bars.lvl-2 span:nth-child(-n+2),
  .bars.lvl-3 span:nth-child(-n+3),
  .bars.lvl-4 span:nth-child(-n+4),
  .bars.lvl-5 span:nth-child(-n+5) {
    background: linear-gradient(180deg,#a78bfa,#8b5cf6);
    box-shadow: 0 0 10px rgba(139,92,246,.55);
  }
  .bars.lvl-1 span:nth-child(1) { height: 30%; }
  .bars.lvl-2 span:nth-child(2) { height: 50%; }
  .bars.lvl-3 span:nth-child(3) { height: 70%; }
  .bars.lvl-4 span:nth-child(4) { height: 90%; }
  .bars.lvl-5 span:nth-child(5) { height: 100%; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; padding-left: 56px; }
  .meta .label { color: #94a3b8; font-size: 11.5px; }
  .meta b { color: #a5b4fc; font-weight: 700; }
  .meta .seen { color: #64748b; font-size: 11px; font-variant-numeric: tabular-nums; }

  .empty { text-align: center; padding: 48px 20px; color: #64748b; animation: fadeIn .6s both; }
  .empty .icon { font-size: 48px; opacity: .35; margin-bottom: 12px; display: block; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .empty p { font-size: 13px; line-height: 1.55; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%,120px);
    padding: 12px 20px; border-radius: 14px;
    background: rgba(20,20,32,.9);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(139,92,246,.4);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,.8);
    font-size: 13.5px; font-weight: 600; color: #fff;
    z-index: 100; opacity: 0;
    transition: transform .45s cubic-bezier(.16,1,.3,1), opacity .3s;
    pointer-events: none;
    max-width: calc(100vw - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { transform: translate(-50%,0); opacity: 1; }
  .toast .em { color: #a5b4fc; }

  /* ================== Панель управления ================== */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
    max-height: 92vh;
    background: linear-gradient(180deg, rgba(20,20,32,.98), rgba(10,10,18,.99));
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,.9);
    transform: translateY(100%);
    transition: transform .45s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.show { transform: translateY(0); }

  .grabber {
    width: 42px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.25);
    margin: 12px auto 6px;
    flex-shrink: 0;
  }

  .sheet-head {
    padding: 8px 20px 16px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  .sheet-head .icon-badge { width: 52px; height: 52px; border-radius: 16px; }
  .sheet-head .icon-badge svg { width: 28px; height: 28px; }
  .sheet-head .info { flex: 1; min-width: 0; }
  .sheet-head h2 {
    font-size: 17px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .sheet-head .sub { font-size: 12px; color: #94a3b8; }
  .close-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: #cbd5e1; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .2s, transform .2s;
  }
  .close-btn:active { transform: scale(.9); background: rgba(255,255,255,.12); }

  .sheet-body {
    overflow-y: auto;
    padding: 16px 20px 32px;
    -webkit-overflow-scrolling: touch;
    flex: 1;
  }
  .sheet-body::-webkit-scrollbar { width: 0; }

  .sec { margin-bottom: 22px; }
  .sec-title {
    font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: #64748b; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .sec-title::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.08), transparent);
  }

  .conn-bar {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    margin-bottom: 18px;
  }
  .conn-btn {
    padding: 16px 20px; border-radius: 16px; border: 0;
    font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg,#22c55e,#16a34a);
    cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 26px -10px rgba(34,197,94,.6);
    transition: transform .2s, opacity .3s;
    position: relative; overflow: hidden;
  }
  .conn-btn:active { transform: scale(.97); }
  .conn-btn.disconnect {
    background: linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow: 0 10px 26px -10px rgba(239,68,68,.6);
  }
  .conn-btn:disabled { opacity: .5; cursor: default; }

  .conn-status {
    padding: 16px 18px; border-radius: 16px;
    background: rgba(28,28,40,.6);
    border: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #94a3b8;
  }
  .conn-status .led {
    width: 10px; height: 10px; border-radius: 50%;
    background: #64748b; flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .conn-status.on .led { background: #4ade80; box-shadow: 0 0 12px #4ade80; animation: dotPulse 1.6s ease-in-out infinite; }
  .conn-status.on { color: #e5e7eb; }

  /* Инфо-карточки */
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .info-item {
    padding: 14px 16px; border-radius: 14px;
    background: rgba(28,28,40,.6);
    border: 1px solid rgba(255,255,255,.06);
    animation: fadeIn .4s both;
  }
  .info-item .k {
    font-size: 10.5px; color: #64748b; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 4px;
  }
  .info-item .v {
    font-size: 14px; color: #fff; font-weight: 600;
    word-break: break-word;
    line-height: 1.3;
  }
  .info-item.wide { grid-column: 1 / -1; }

  /* Батарея */
  .batt {
    padding: 18px 20px; border-radius: 18px;
    background: rgba(28,28,40,.6);
    border: 1px solid rgba(255,255,255,.06);
  }
  .batt-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .batt-num {
    font-size: 40px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg,#4ade80,#22c55e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: color .3s;
  }
  .batt-num.low { background: linear-gradient(135deg,#f87171,#ef4444); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .batt-num.mid { background: linear-gradient(135deg,#facc15,#f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .batt-pct { font-size: 18px; color: #94a3b8; font-weight: 700; margin-left: 4px; }
  .batt-track {
    height: 10px; border-radius: 6px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .batt-fill {
    height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg,#22c55e,#4ade80);
    box-shadow: 0 0 20px rgba(74,222,128,.5);
    transition: width .8s cubic-bezier(.16,1,.3,1), background .3s;
  }

  /* Пресеты управления */
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .preset {
    padding: 18px 14px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(28,28,40,.65);
    color: #e5e7eb; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform .18s, background .25s, border-color .25s;
    text-align: center;
  }
  .preset:active { transform: scale(.96); }
  .preset .preset-ico { font-size: 26px; }
  .preset.on {
    background: rgba(250,204,21,.12);
    border-color: rgba(250,204,21,.4);
    color: #fde68a;
  }
  .preset.off {
    background: rgba(100,116,139,.12);
    border-color: rgba(100,116,139,.3);
    color: #94a3b8;
  }
  .preset.rainbow {
    background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(59,130,246,.15), rgba(16,185,129,.15));
    border-color: rgba(139,92,246,.3);
  }

  .color-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 14px;
    background: rgba(28,28,40,.6);
    border: 1px solid rgba(255,255,255,.06);
    margin-top: 10px;
  }

function shortUuid(uuid) {
  const u = (uuid || '').toLowerCase();
  if (u.length === 36 && u.startsWith('0000') && u.endsWith('-0000-1000-8000-00805f9b34fb')) {
    return '0x' + u.slice(4, 8).toUpperCase();

function detectType(rawName) {
  const n = (rawName || '').toLowerCase();

  if (/\biphone\b/.test(n)) return 'phone';
  if (/\bipad\b/.test(n)) return 'tablet';
  if (/\bmacbook|\bimac|\bmac\s?mini|\bmac\s?pro|\bmac\s?studio/.test(n)) return 'laptop';

  if (/\blaptop\b|\bnotebook\b|\bthinkpad\b|\bsurface\b|\bzenbook\b|\bideapad\b/.test(n)) return 'laptop';

  if (/\bspeaker\b|\bsoundbar\b|\becho\b|\bjbl\s?flip|\bjbl\s?charge/.test(n)) return 'speaker';
  if (/\btesla\b|\bbmw\b|\baudi\b|\btoyota\b|\bhonda\b|\bmercedes\b|\bvolvo\b|\bcar\b|\bauto\b|\bobd\b/.test(n)) return 'car';
  if (/\bled\b|\blednet|\blight\b|\blamp\b|\bbulb\b|\bhue\b|\blifx\b|\byeelight\b|\bphilips\s?hue/.test(n)) return 'light';
  if (/\btile\b|\btracker\b|\btag\b|\bchipolo\b/.test(n)) return 'tracker';
  if (/\bcam\b|\bcamera\b|\bgopro\b|\binsta360\b/.test(n)) return 'camera';
  if (/\bprint|\bepson\b|\bcanon\b|\bhp\s|\bdeskjet\b|\blaserjet\b/.test(n)) return 'printer';
  if (/\bkeyboard\b|\bkbd\b/.test(n)) return 'keyboard';
  if (/\bmouse\b|\bmice\b/.test(n))    return 'mouse';
  if (/\bgamepad\b|\bcontroller|\bxbox|\bdualsense|\bdualshock/.test(n)) return 'gamepad';
  if (/\bbeacon\b|\bibeacon\b|\beddystone\b/.test(n)) return 'beacon';
  if (/\bdrone\b|\bdji\b/.test(n)) return 'drone';
  return 'unknown';
}

/* ============================================================
   Состояние
   ============================================================ */
const devices = new Map();
const ACTIVE_MS = 6000;

const listEl   = document.getElementById('list');
const emptyEl  = document.getElementById('empty');
const statusEl = document.getElementById('status');
const radarEl  = document.getElementById('radar');
const btn      = document.getElementById('scan');
const clearBtn = document.getElementById('clear');
const toastEl  = document.getElementById('toast');
const sTotal   = document.getElementById('s-total');
const sActive  = document.getElementById('s-active');
const sBest    = document.getElementById('s-best');

const sheet       = document.getElementById('sheet');
const backdrop    = document.getElementById('backdrop');
const sheetIcon   = document.getElementById('sheet-icon');
const sheetName   = document.getElementById('sheet-name');
const sheetSub    = document.getElementById('sheet-sub');
const sheetBody   = document.getElementById('sheet-body');
const closeSheet  = document.getElementById('closeSheet');

let activeEntry = null;
let activeServer = null;
const connectedEntries = new Set();

/* ============================================================
   Утилиты
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function bytesToHex(dv) {
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join(' ');
}

function bytesToText(dv) {
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  // Печатаемый ASCII?
  let printable = true;
  for (const b of bytes) {
    if (b < 32 && b !== 9 && b !== 10 && b !== 13) { printable = false; break; }
  }
  if (printable && bytes.length > 0) {
    return new TextDecoder().decode(bytes).replace(/\s+$/, '');
  }
  return null;
}

function hexToBytes(str) {
  const clean = str.replace(/[^0-9a-fA-F]/g, '');
  if (clean.length === 0) return new Uint8Array(0);
  if (clean.length % 2 !== 0) throw new Error('Hex должен быть чётной длины');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i*2, 2), 16);
  return out;
}

function rssiInfo(rssi) {
  if (rssi === null || rssi === undefined) return { label: 'нет данных', cls: 'na', bars: '' };
  if (rssi > -55) return { label: 'очень близко', cls: 'b5', bars: 'lvl-5' };
  if (rssi > -70) return { label: 'близко',       cls: 'b4', bars: 'lvl-4' };
  if (rssi > -80) return { label: 'средне',       cls: 'b3', bars: 'lvl-3' };
  if (rssi > -90) return { label: 'далеко',       cls: 'b2', bars: 'lvl-2' };
  return              { label: 'очень далеко', cls: 'b1', bars: 'lvl-1' };
}

function showToast(text, emoji = '✨') {
  toastEl.innerHTML = `<span class="em">${emoji}</span> ${escapeHtml(text)}`;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 320);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 2) return 'только что';
  if (s < 60) return `${s} сек назад`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} мин назад`;
  return `${Math.floor(m/60)} ч назад`;
}

function buildIconHtml(type) {
  const cat = CAT[type] || CAT.unknown;
  const svg = ICONS[type] || ICONS.unknown;
  return { badge: `<div class="icon-badge" style="background:${cat.bg}">${svg}</div>`, label: cat.label, type };
}

/* ============================================================
   Карточка устройства
   ============================================================ */
function createCard(id, name) {
  const type = detectType(name);
  const { badge, label } = buildIconHtml(type);

  const el = document.createElement('div');
  el.className = 'dev fresh';
  el.dataset.id = id;
  el.innerHTML = `
    <div class="row1">
      <div class="icon-slot">${badge}</div>
      <div class="name-wrap">
        <div class="name">${escapeHtml(name || 'Устройство без имени')}</div>
        <div class="type-label">${label}</div>
      </div>
      <div class="live">
        <span class="dot"></span><span class="live-text">в эфире</span>
      </div>
    </div>
    <div class="id">${escapeHtml(id)}</div>
    <div class="bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="meta">
      <span class="label">Уровень сигнала</span>
      <span><b class="rssi">—</b></span>
    </div>
    <div class="meta" style="margin-top:4px">
      <span class="label">Последний раз</span>
      <span class="seen">только что</span>
    </div>
  `;
  el.addEventListener('click', () => openSheet(id));
  return el;
}

function updateCard(entry) {
  const { el, rssi, lastSeen } = entry;
  const info = rssiInfo(rssi);

  const rssiEl = el.querySelector('.rssi');
  const barsEl = el.querySelector('.bars');
  const liveEl = el.querySelector('.live');
  const liveText = el.querySelector('.live-text');
  const seenEl = el.querySelector('.seen');

  rssiEl.textContent = rssi === null ? '—' : rssi + ' дБм';
  barsEl.className = 'bars ' + info.bars;

  const isConnected = connectedEntries.has(entry.id);
  const isActive = Date.now() - lastSeen < ACTIVE_MS;

  if (isConnected) {
    liveEl.classList.remove('stale');
    liveEl.classList.add('connected');
    liveText.textContent = 'подключено';
    el.classList.remove('stale');
  } else if (isActive) {
    liveEl.classList.remove('stale', 'connected');
    liveText.textContent = 'в эфире';
    el.classList.remove('stale');
  } else {
    liveEl.classList.remove('connected');
    liveEl.classList.add('stale');
    liveText.textContent = 'не слышно';
    el.classList.add('stale');
  }
  seenEl.textContent = timeAgo(lastSeen);

  const currentType = detectType(entry.name);
  if (currentType !== entry.type) {
    entry.type = currentType;
    const { badge, label } = buildIconHtml(currentType);
    const slot = el.querySelector('.icon-slot');
    const labelEl = el.querySelector('.type-label');
    if (slot) slot.innerHTML = badge;
    if (labelEl) labelEl.textContent = label;
  }
  if (entry.name) {
    const nameEl = el.querySelector('.name');
    if (nameEl && nameEl.textContent !== entry.name) nameEl.textContent = entry.name;
  }
}

function sortList() {
  const entries = [...devices.values()];
  entries.sort((a, b) => {
    const ra = a.rssi === null ? -999 : a.rssi;
    const rb = b.rssi === null ? -999 : b.rssi;
    return rb - ra;
  });
  const positions = new Map();
  entries.forEach(e => { if (e.el.isConnected) positions.set(e.el, e.el.getBoundingClientRect().top); });
  entries.forEach(e => listEl.appendChild(e.el));
  entries.forEach(e => {
    if (!e.el.isConnected) return;
    const oldTop = positions.get(e.el);
    if (oldTop === undefined) return;
    const newTop = e.el.getBoundingClientRect().top;
    const dy = oldTop - newTop;
    if (Math.abs(dy) < 1) return;
    e.el.animate(
      [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
      { duration: 500, easing: 'cubic-bezier(0.16,1,0.3,1)' }
    );
  });
}

function refreshStats() {
  const total = devices.size;
  const active = [...devices.values()].filter(d => Date.now() - d.lastSeen < ACTIVE_MS).length;
  let best = null;
  for (const d of devices.values()) {
    if (d.rssi === null) continue;
    if (best === null || d.rssi > best) best = d.rssi;
  }
  if (sTotal.textContent !== String(total)) { sTotal.textContent = total; bump(sTotal); }
  if (sActive.textContent !== String(active)) { sActive.textContent = active; bump(sActive); }
  const bestStr = best === null ? '—' : best;
  if (sBest.textContent !== String(bestStr)) { sBest.textContent = bestStr; bump(sBest); }
  clearBtn.disabled = total === 0;
  emptyEl.style.display = total === 0 ? '' : 'none';
}

function addDevice(device) {
  const id = device.id;
  const name = device.name || null;

  if (devices.has(id)) {
    const e = devices.get(id);
    e.lastSeen = Date.now();
    if (name) e.name = name;
    updateCard(e);
    e.el.classList.remove('flash'); void e.el.offsetWidth; e.el.classList.add('flash');
    e.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast('Уже в списке · ' + (e.name || 'без имени'), '🔁');
    return e;
  }

  const el = createCard(id, name);
  const entry = {
    id, name, rssi: null, lastSeen: Date.now(),
    el, watching: false,
    type: detectType(name),
    bleDevice: device
  };
  devices.set(id, entry);

  listEl.appendChild(el);
  updateCard(entry);
  refreshStats();

  const cat = CAT[entry.type] || CAT.unknown;
  showToast(cat.label + ' · ' + (name || 'без имени'), '🎯');

  setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  startWatching(device, entry);
  setTimeout(sortList, 400);
  return entry;
}

async function startWatching(device, entry) {
  if (entry.watching) return;
  if (!device.watchAdvertisements) { entry.lastSeen = Date.now(); updateCard(entry); return; }
  try {
    entry.watching = true;
    device.addEventListener('advertisementreceived', (e) => {
      entry.rssi = e.rssi;
      entry.lastSeen = Date.now();
      if (e.device && e.device.name) entry.name = e.device.name;
      updateCard(entry);
      refreshStats();
    });
    await device.watchAdvertisements();
  } catch (err) { entry.watching = false; }
}

/* ============================================================
   Открытие панели управления
   ============================================================ */
function openSheet(id) {
  const entry = devices.get(id);
  if (!entry) return;
  activeEntry = entry;

  const { badge, label } = buildIconHtml(entry.type);
  sheetIcon.innerHTML = badge;
  sheetName.textContent = entry.name || 'Устройство без имени';
  sheetSub.textContent = label + ' · ' + (entry.rssi !== null ? entry.rssi + ' дБм' : 'нет данных');

  renderSheetBody();

  sheet.classList.add('show');
  backdrop.classList.add('show');
  document.body.classList.add('no-scroll');
}

function closeSheetFn() {
  sheet.classList.remove('show');
  backdrop.classList.remove('show');
  document.body.classList.remove('no-scroll');
  activeEntry = null;
}

closeSheet.addEventListener('click', closeSheetFn);
backdrop.addEventListener('click', closeSheetFn);

/* ============================================================
   Лог
   ============================================================ */
function log(msg, type = '') {
  const box = document.getElementById('logBox');
  if (!box) return;
  const t = new Date();
  const stamp = t.getHours().toString().padStart(2,'0') + ':' +
                t.getMinutes().toString().padStart(2,'0') + ':' +
                t.getSeconds().toString().padStart(2,'0');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.innerHTML = `<span class="t">${stamp}</span> ${escapeHtml(msg)}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;

  // Ограничим количество строк
  while (box.children.length > 200) box.removeChild(box.firstChild);
}

/* ============================================================
   Подключение / отключение
   ============================================================ */
async function toggleConnection() {
  const entry = activeEntry;
  if (!entry) return;
  const isConnected = connectedEntries.has(entry.id);

  if (isConnected) {
    try {
      if (entry.bleDevice && entry.bleDevice.gatt && entry.bleDevice.gatt.connected) {
        entry.bleDevice.gatt.disconnect();
      }
    } catch (e) {}
    connectedEntries.delete(entry.id);
    activeServer = null;
    log('Отключено от ' + (entry.name || entry.id), 'info');
    showToast('Отключено', '🔌');
    updateCard(entry);
    renderSheetBody();
    return;
  }

  if (!entry.bleDevice || !entry.bleDevice.gatt) {
    log('GATT недоступен на этом устройстве', 'err');
    return;
  }

  const btn = document.getElementById('connBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Подключение...';
  log('Подключаюсь к ' + (entry.name || entry.id) + '...', 'info');

  try {
    const server = await entry.bleDevice.gatt.connect();
    activeServer = server;
    connectedEntries.add(entry.id);
    log('Подключено успешно', 'ok');
    showToast('Подключено', '🔗');

    // Отслеживаем разрыв
    entry.bleDevice.addEventListener('gattserverdisconnected', () => {
      connectedEntries.delete(entry.id);
      activeServer = null;
      log('Соединение разорвано', 'err');
      if (activeEntry && activeEntry.id === entry.id) renderSheetBody();
      updateCard(entry);
    });

    updateCard(entry);
    renderSheetBody();
    await reloadData();
  } catch (e) {
    log('Ошибка подключения: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '🔗 Подключиться';
    showToast('Ошибка подключения', '⚠️');
  }
}

/* ============================================================
   Загрузка данных после подключения
   ============================================================ */
async function reloadData() {
  if (!activeServer) return;
  await readBattery();
  await readDeviceInfo();
  await listServices();
}

/* ============================================================
   Батарея
   ============================================================ */
async function readBattery() {
  if (!activeServer) return;
  const numEl = document.getElementById('battNum');
  const fillEl = document.getElementById('battFill');
  if (!numEl || !fillEl) return;

  try {
    const svc = await activeServer.getPrimaryService('battery_service');
    const ch = await svc.getCharacteristic('battery_level');
    const dv = await ch.readValue();
    const pct = dv.getUint8(0);
    numEl.textContent = pct;
    fillEl.style.width = pct + '%';

    numEl.classList.remove('low', 'mid');
    fillEl.style.background = 'linear-gradient(90deg,#22c55e,#4ade80)';
    fillEl.style.boxShadow = '0 0 20px rgba(74,222,128,.5)';
    if (pct <= 20) {
      numEl.classList.add('low');
      fillEl.style.background = 'linear-gradient(90deg,#ef4444,#f87171)';
      fillEl.style.boxShadow = '0 0 20px rgba(248,113,113,.5)';
    } else if (pct <= 50) {
      numEl.classList.add('mid');
      fillEl.style.background = 'linear-gradient(90deg,#f59e0b,#facc15)';
      fillEl.style.boxShadow = '0 0 20px rgba(250,204,21,.5)';
    }

    log('Батарея: ' + pct + '%', 'ok');

    // Подписка на обновления
    try {
      await ch.startNotifications();
      ch.addEventListener('characteristicvaluechanged', (e) => {
        const v = e.target.value.getUint8(0);
        numEl.textContent = v;
        fillEl.style.width = v + '%';
      });
    } catch (e) {}
  } catch (e) {
    numEl.textContent = '—';
    fillEl.style.width = '0%';
    log('Батарея недоступна: ' + e.message, '');
  }
}

/* ============================================================
   Инфо об устройстве
   ============================================================ */
async function readDeviceInfo() {
  if (!activeServer) return;
  try {
    const svc = await activeServer.getPrimaryService('device_information');
    const map = {
      'manufacturer_name_string': 'infoManuf',
      'model_number_string':      'infoModel',
      'firmware_revision_string': 'infoFw',
      'serial_number_string':     'infoSn'
    };
    for (const [charName, elId] of Object.entries(map)) {
      const el = document.getElementById(elId);
      if (!el) continue;
      try {
        const ch = await svc.getCharacteristic(charName);
        const dv = await ch.readValue();
        const txt = bytesToText(dv) || bytesToHex(dv);
        el.textContent = txt;
        log(uuidName(ch.uuid) || charName, 'data');
      } catch (e) {
        el.textContent = '—';
      }
    }
  } catch (e) {
    log('Device Information недоступен', '');
  }
}

/* ============================================================
   Список сервисов и характеристик
   ============================================================ */
async function listServices() {
  if (!activeServer) return;
  const box = document.getElementById('servicesBox');
  if (!box) return;
  box.innerHTML = '<div class="empty-sec"><span class="loader"></span>Загружаю сервисы...</div>';

  try {
    const services = await activeServer.getPrimaryServices();
    if (services.length === 0) {
      box.innerHTML = '<div class="empty-sec">Сервисы не найдены</div>';
      return;
    }

    let html = '';
    for (const svc of services) {
      const sName = uuidName(svc.uuid);
      const sLabel = sName || shortUuid(svc.uuid);
      const svcId = 'svc-' + svc.uuid.replace(/[^a-z0-9]/gi, '');

      html += `
        <div class="service" data-uuid="${escapeHtml(svc.uuid)}">
          <div class="service-head">
            <span class="arrow">▶</span>
            <div class="svc-info">
              <div class="svc-name">${escapeHtml(sLabel)}</div>
              <div class="svc-uuid">${escapeHtml(svc.uuid)}</div>
            </div>
          </div>
          <div class="char-list" id="${svcId}">
            <div class="empty-sec"><span class="loader"></span></div>
          </div>
        </div>
      `;
    }
    box.innerHTML = html;

    // Обработчики раскрытия
    box.querySelectorAll('.service').forEach(svcEl => {
      const svcUuid = svcEl.dataset.uuid;
      const svc = services.find(s => s.uuid === svcUuid);
      const head = svcEl.querySelector('.service-head');
      const charList = svcEl.querySelector('.char-list');
      const svcId = charList.id;

      head.addEventListener('click', async () => {
        svcEl.classList.toggle('open');
        if (svcEl.classList.contains('open') && !svcEl.dataset.loaded) {
          svcEl.dataset.loaded = '1';
          await loadCharacteristics(svc, charList);
        }
      });
    });

    log('Найдено сервисов: ' + services.length, 'ok');
  } catch (e) {
    box.innerHTML = '<div class="empty-sec" style="color:#f87171">Ошибка: ' + escapeHtml(e.message) + '</div>';
    log('Ошибка чтения сервисов: ' + e.message, 'err');
  }
}

async function loadCharacteristics(svc, container) {
  try {
    const chars = await svc.getCharacteristics();
    if (chars.length === 0) {
      container.innerHTML = '<div class="empty-sec">Характеристик нет</div>';
      return;
    }

    let html = '';
    for (const ch of chars) {
      const cName = uuidName(ch.uuid);
      const props = ch.properties;
      const tags = [];
      if (props.read)   tags.push('<span class="tag read">read</span>');
      if (props.write)  tags.push('<span class="tag write">write</span>');
      if (props.writeWithoutResponse) tags.push('<span class="tag write">write nr</span>');
      if (props.notify) tags.push('<span class="tag notify">notify</span>');
      if (props.indicate) tags.push('<span class="tag notify">indicate</span>');

      const cid = 'ch-' + ch.uuid.replace(/[^a-z0-9]/gi, '') + '-' + Math.random().toString(36).slice(2,6);

      html += `
        <div class="char" data-uuid="${escapeHtml(ch.uuid)}" id="${cid}">
          <div class="char-uuid">${escapeHtml((cName ? cName + ' · ' : '') + ch.uuid)}</div>
          <div class="char-props">${tags.join('')}</div>
          <div class="char-actions">
            ${props.read ? `<button class="mini-btn" data-act="read">📖 Прочитать</button>` : ''}
            ${props.write || props.writeWithoutResponse ? `<button class="mini-btn write" data-act="write">✍️ Записать</button>` : ''}
            ${props.notify || props.indicate ? `<button class="mini-btn notify" data-act="notify">🔔 Слушать</button>` : ''}
          </div>
          <div class="char-value" id="${cid}-val" style="display:none"></div>
          <div class="hex-row" id="${cid}-hex" style="display:none">
            <input type="text" placeholder="Например: 01 ff 00 или текст" data-hexinput>
            <button class="mini-btn write" data-act="send">Отправить</button>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;

    // Обработчики
    container.querySelectorAll('.char').forEach(charEl => {
      const chUuid = charEl.dataset.uuid;
      const ch = chars.find(c => c.uuid === chUuid);
      const valBox = charEl.querySelector('.char-value');
      const hexBox = charEl.querySelector('.hex-row');
      const hexInput = hexBox ? hexBox.querySelector('[data-hexinput]') : null;

      charEl.querySelectorAll('[data-act]').forEach(btn => {
        const act = btn.dataset.act;
        btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          if (act === 'read') {
            try {
              const dv = await ch.readValue();
              const txt = bytesToText(dv);
              const hex = bytesToHex(dv);
              valBox.style.display = 'block';
              valBox.textContent = txt ? `"${txt}"\n${hex}` : hex;
              log('Read ' + shortUuid(ch.uuid) + ': ' + hex, 'data');
            } catch (e) {
              valBox.style.display = 'block';
              valBox.textContent = 'Ошибка: ' + e.message;
              log('Ошибка чтения: ' + e.message, 'err');
            }
          } else if (act === 'write') {
            hexBox.style.display = hexBox.style.display === 'none' ? 'flex' : 'none';
          } else if (act === 'send') {
            const val = hexInput.value.trim();
            if (!val) return;
            try {
              let bytes;
              // Пробуем как hex, если не получилось — как текст
              if (/^[0-9a-fA-F\s]+$/.test(val) && val.replace(/\s/g,'').length % 2 === 0) {
                bytes = hexToBytes(val);
              } else {
                bytes = new TextEncoder().encode(val);
              }
              if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) {
                await ch.writeValueWithoutResponse(bytes);
              } else {
                await ch.writeValue(bytes);
              }
              log('Write ' + shortUuid(ch.uuid) + ' ← ' + bytesToHex(bytes.buffer), 'ok');
              showToast('Отправлено', '✍️');
            } catch (e) {
              log('Ошибка записи: ' + e.message, 'err');
              showToast('Ошибка записи', '⚠️');
            }
          } else if (act === 'notify') {
            try {
              if (btn.classList.contains('on')) {
                await ch.stopNotifications();
                btn.classList.remove('on');
                btn.textContent = '🔔 Слушать';
                log('Отписка от ' + shortUuid(ch.uuid), 'info');
              } else {
                await ch.startNotifications();
                btn.classList.add('on');
                btn.textContent = '🔕 Прекратить';
                ch.addEventListener('characteristicvaluechanged', (e) => {
                  const dv = e.target.value;
                  const txt = bytesToText(dv);
                  const hex = bytesToHex(dv);
                  valBox.style.display = 'block';
                  valBox.textContent = txt ? `"${txt}"\n${hex}` : hex;
                  log('Notify ' + shortUuid(ch.uuid) + ': ' + hex, 'data');
                });
                log('Подписка на ' + shortUuid(ch.uuid), 'ok');
              }
            } catch (e) {
              log('Ошибка notify: ' + e.message, 'err');
            }
          }
        });
      });
    });
  } catch (e) {
    container.innerHTML = '<div class="empty-sec" style="color:#f87171">Ошибка: ' + escapeHtml(e.message) + '</div>';
  }
}

/* ============================================================
   Управление умной лампой — поиск writable характеристики
   ============================================================ */
async function findWritableCharacteristic() {
  if (!activeServer) return null;
  try {
    const services = await activeServer.getPrimaryServices();
    // Приоритет — специфичные сервисы ламп
    const preferred = ['fff0', 'ffe0', 'ffe5', 'ff01', 'fee7', '1912'];
    let fallback = null;

    for (const svc of services) {
      const short = shortUuid(svc.uuid).toLowerCase().replace('0x', '');
      const isPreferred = preferred.includes(short);
      try {
        const chars = await svc.getCharacteristics();
        for (const ch of chars) {
          if (ch.properties.write || ch.properties.writeWithoutResponse) {
            if (isPreferred) return ch;
            if (!fallback) fallback = ch;
          }
        }
      } catch (e) {}
    }
    return fallback;
  } catch (e) {
    return null;
  }
}

async function writeToChar(ch, bytes) {
  try {
    if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) {
      await ch.writeValueWithoutResponse(bytes);
    } else {
      await ch.writeValue(bytes);
    }
    return true;
  } catch (e) {
    log('Ошибка отправки: ' + e.message, 'err');
    return false;
  }
}

async function sendPreset(cmd) {
  if (!activeServer) {
    showToast('Сначала подключись', '⚠️');
    return;
  }

  const ch = await findWritableCharacteristic();
  if (!ch) {
    showToast('Нет доступных команд', '⚠️');
    log('Не найдено writable-характеристик', 'err');
    return;
  }

  // Универсальные команды (подходят для большинства дешёвых LED-контроллеров)
  const COMMANDS = {
    on:      [0x7E, 0x00, 0x04, 0x01, 0x00, 0x00, 0x00, 0x00, 0xEF],
    off:     [0x7E, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0xEF],
    rainbow: [0x7E, 0x00, 0x05, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00, 0xEF],
    blink:   [0x7E, 0x00, 0x04, 0x02, 0x00, 0x00, 0x00, 0x00, 0xEF]
  };

  const arr = COMMANDS[cmd] || COMMANDS.on;
  const bytes = new Uint8Array(arr);
  const ok = await writeToChar(ch, bytes);
  if (ok) {
    const names = { on: 'Включение', off: 'Выключение', rainbow: 'Радуга', blink: 'Мигание' };
    log(names[cmd] + ' → ' + shortUuid(ch.uuid), 'ok');
    showToast(names[cmd], '💡');
  }
}

async function sendColor(hex) {
  if (!activeServer) { showToast('Сначала подключись', '⚠️'); return; }

  const ch = await findWritableCharacteristic();
  if (!ch) { showToast('Нет доступных команд', '⚠️'); return; }

  // Парсим hex "#RRGGBB"
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);

  // Формат ELK-BLEDOM / аналогов
  const bytes = new Uint8Array([0x7E, 0x00, 0x05, 0x03, r, g, b, 0x00, 0xEF]);
  const ok = await writeToChar(ch, bytes);
  if (ok) {
    log(`Цвет RGB(${r},${g},${b}) → ${shortUuid(ch.uuid)}`, 'ok');
    showToast('Цвет применён', '🎨');
  }
}

/* ============================================================
   Кнопка сканирования
   ============================================================ */
btn.addEventListener('click', async () => {
  statusEl.className = 'status';
  statusEl.textContent = '';

  if (!navigator.bluetooth) {
    statusEl.className = 'status err';
    statusEl.textContent = 'Bluetooth недоступен. Установи beacio для Safari.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Открываю список...';
  radarEl.classList.add('on');
  statusEl.textContent = 'Выбери устройство в системном окне';

  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        'generic_access',
        'generic_attribute',
        'device_information',
        'battery_service',
        'heart_rate',
        'health_thermometer',
        'environmental_sensing',
        'user_data',
        'current_time',
        'tx_power',
        'link_loss',
        'immediate_alert',
        'blood_pressure',
        'weight_scale',
        'glucose',
        'cycling_speed_and_cadence',
        'running_speed_and_cadence',
        'human_interface_device',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ffe5-0000-1000-8000-00805f9b34fb',
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ff01-0000-1000-8000-00805f9b34fb',
        '0000fee7-0000-1000-8000-00805f9b34fb',
        '0000fe59-0000-1000-8000-00805f9b34fb',
        '00010203-0405-0607-0809-0a0b0c0d1912'
      ]
    });

    radarEl.classList.remove('on');
    statusEl.className = 'status ok';
    statusEl.textContent = '✓ Добавлено в список';
    addDevice(device);

    setTimeout(() => {
      if (statusEl.textContent.startsWith('✓')) {
        statusEl.textContent = 'Нажми ещё раз, чтобы добавить следующее';
        statusEl.className = 'status';
      }
    }, 1800);
  } catch (e) {
    radarEl.classList.remove('on');
    if (String(e.message).toLowerCase().includes('cancel')) {
      statusEl.textContent = 'Отменено';
    } else {
      statusEl.className = 'status err';
      statusEl.textContent = 'Ошибка: ' + e.message;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Добавить устройство';
  }
});

/* ============================================================
   Очистка
   ============================================================ */
clearBtn.addEventListener('click', () => {
  if (devices.size === 0) return;
  if (!confirm('Очистить список устройств?')) return;

  for (const e of devices.values()) {
    try {
      if (e.bleDevice && e.bleDevice.gatt && e.bleDevice.gatt.connected) {
        e.bleDevice.gatt.disconnect();
      }
    } catch (err) {}
    e.el.style.transition = 'opacity .3s, transform .3s';
    e.el.style.opacity = '0';
    e.el.style.transform = 'scale(0.9)';
    setTimeout(() => e.el.remove(), 300);
  }
  devices.clear();
  connectedEntries.clear();
  activeServer = null;
  refreshStats();
  showToast('Список очищен', '🧹');
  statusEl.textContent = '';
  statusEl.className = 'status';
});

/* ============================================================
   Таймер
   ============================================================ */
setInterval(() => {
  for (const e of devices.values()) updateCard(e);
  refreshStats();
}, 1000);

setTimeout(() => showToast('Готово к сканированию', '👋'), 700);
